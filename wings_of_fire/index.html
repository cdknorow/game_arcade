<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings of Fire - Action Game</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        canvas { display: block; background: #000; margin: 0 auto; border: 4px solid #444; }
        #ui-layer { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px #000; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 2px solid #e67e22; }
        .btn { padding: 12px 24px; margin: 10px; cursor: pointer; background: #e67e22; border: none; color: white; font-weight: bold; border-radius: 5px; font-size: 14px; }
        .btn:hover { background: #d35400; }
        .btn.locked { background: #555; cursor: not-allowed; opacity: 0.6; }
        .stats { font-size: 12px; color: #ccc; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="hud">
        <strong>HP:</strong> <span id="hp-val">100</span> |
        <strong>Squad:</strong> <span id="lives-val">3</span> |
        <strong>Biome:</strong> <span id="biome-val">Forest</span><br>
        <small>WASD to Fly | Space to Breathe Fire</small>
    </div>
</div>

<div id="menu">
    <h1>WINGS OF FIRE</h1>
    <p>Choose your Lead Dragon</p>
    <div id="dragon-buttons"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 500;

const GRAVITY = 0.15;
const FRICTION = 0.95;
const LEVEL_LENGTH = 5000;
const BIOMES = [
    { name: "Forest", bg: "#1a2f1a", platform: "#3d2b1f", secondary: "#2d4c2d", cloud: "#2a3a2a" },
    { name: "Swamp", bg: "#2d3319", platform: "#1a1c0e", secondary: "#3d4421", cloud: "#3a3d20" },
    { name: "Mountains", bg: "#3e444c", platform: "#222", secondary: "#555a61", cloud: "#5a6070" },
    { name: "Snowy Mountains", bg: "#dee4e7", platform: "#aab", secondary: "#ffffff", cloud: "#f0f4f8" },
    { name: "Volcano", bg: "#4a1010", platform: "#200", secondary: "#801010", cloud: "#6a2020" }
];

const TRIBE_STATS = {
    Sky:   { maxHp: 80,  speed: 0.9, shootCooldown: 15, color: '#81ecec', projColor: 'orange',  projRadius: 4 },
    Mud:   { maxHp: 200, speed: 0.5, shootCooldown: 25, color: '#a29bfe', projColor: '#8B4513', projRadius: 5, meleeImmune: true },
    Sea:   { maxHp: 100, speed: 0.7, shootCooldown: 20, color: '#74b9ff', projColor: '#b0e0ff', projRadius: 8 },
    Ice:   { maxHp: 90,  speed: 0.75, shootCooldown: 22, color: '#00cec9', projColor: '#00d2ff', projRadius: 5, freeze: true },
    Night: { maxHp: 85,  speed: 0.95, shootCooldown: 18, color: '#2d3436', projColor: '#6c5ce7', projRadius: 4, piercing: true }
};

let gameState = "MENU";
let currentBiomeIndex = 0;
let playerTeam = [];
let platforms = [];
let projectiles = [];
let enemies = [];
let collectibles = [];
let cloudLayers = [];
let hillLayers = [];
let levelTransitioning = false;
let transitionTimer = 0;
let transitionBiomeName = "";
let fortress = null;
let dragonBoss = null;
let screenShake = 0;
let particles = [];

// --- Unlock System ---
function getUnlockedTribes() {
    const saved = localStorage.getItem('wof_unlocked');
    return saved ? JSON.parse(saved) : ['Sky', 'Mud', 'Sea'];
}

function unlockTribe(tribe) {
    const unlocked = getUnlockedTribes();
    if (!unlocked.includes(tribe)) {
        unlocked.push(tribe);
        localStorage.setItem('wof_unlocked', JSON.stringify(unlocked));
    }
}

function buildMenu() {
    const container = document.getElementById('dragon-buttons');
    container.innerHTML = '';
    const unlocked = getUnlockedTribes();
    const allTribes = [
        { type: 'Sky', label: 'Sky Dragon', desc: 'Fast - Low Health' },
        { type: 'Mud', label: 'Mud Dragon', desc: 'Tank - Slow - Melee Immune' },
        { type: 'Sea', label: 'Sea Dragon', desc: 'Balanced - Steam Breath' },
        { type: 'Ice', label: 'Ice Dragon', desc: 'Freeze Enemies' },
        { type: 'Night', label: 'Night Dragon', desc: 'Fast - Piercing Fire' }
    ];
    allTribes.forEach(t => {
        const btn = document.createElement('button');
        const isUnlocked = unlocked.includes(t.type);
        btn.className = 'btn' + (isUnlocked ? '' : ' locked');
        btn.innerHTML = `${t.label}<br><span class="stats">${isUnlocked ? t.desc : 'LOCKED'}</span>`;
        if (isUnlocked) {
            btn.onclick = () => startGame(t.type);
        }
        container.appendChild(btn);
    });
}

// --- Camera Class ---
class Camera {
    constructor() { this.x = 0; this.y = 0; }
    update(target) {
        const targetX = target.x - 150;
        const targetY = Math.min(0, target.y - canvas.height / 2);
        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.05;
        if (this.y > 0) this.y = 0;
    }
}

const camera = new Camera();

// --- Particles ---
class Particle {
    constructor(x, y, vx, vy, color, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.life = life; this.maxLife = life;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.02;
        this.life--;
    }
    draw() {
        const alpha = this.life / this.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        const size = 2 + alpha * 3;
        ctx.fillRect(this.x - camera.x, this.y - camera.y, size, size);
        ctx.globalAlpha = 1.0;
    }
}

function spawnFireParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(
            x, y,
            (Math.random() - 0.5) * 3,
            (Math.random() - 0.5) * 3,
            color, 15 + Math.random() * 15
        ));
    }
}

// --- PIXEL ART GENERATOR ---
function createDragonCanvas(type, isEnemy) {
    const sCanvas = document.createElement('canvas');
    sCanvas.width = 40; sCanvas.height = 30;
    const sCtx = sCanvas.getContext('2d');
    const color = isEnemy ? '#ff7675' : (TRIBE_STATS[type]?.color || '#81ecec');

    // Body
    sCtx.fillStyle = color;
    sCtx.fillRect(10, 10, 20, 10); // Torso

    // Head
    sCtx.fillRect(28, 5, 10, 10);

    // Horns
    sCtx.fillStyle = isEnemy ? '#d63031' : darkenColor(color, 40);
    sCtx.fillRect(30, 2, 2, 4);
    sCtx.fillRect(35, 2, 2, 4);

    // Eye
    sCtx.fillStyle = isEnemy ? "yellow" : "white";
    sCtx.fillRect(33, 7, 3, 3);
    sCtx.fillStyle = "black";
    sCtx.fillRect(34, 8, 2, 2);

    // Tail with detail
    sCtx.fillStyle = color;
    sCtx.fillRect(2, 13, 10, 4);
    sCtx.fillRect(0, 11, 4, 3); // Tail tip
    sCtx.fillStyle = darkenColor(color, 30);
    sCtx.fillRect(0, 11, 3, 2);

    // Legs
    sCtx.fillStyle = darkenColor(color, 20);
    sCtx.fillRect(14, 20, 3, 5);
    sCtx.fillRect(24, 20, 3, 5);

    // Tribe-specific features
    if (type === 'Ice' && !isEnemy) {
        // Ice spikes along back
        sCtx.fillStyle = '#00fff5';
        sCtx.fillRect(14, 7, 2, 4);
        sCtx.fillRect(18, 6, 2, 5);
        sCtx.fillRect(22, 7, 2, 4);
    }
    if (type === 'Night' && !isEnemy) {
        // Dark wing accents
        sCtx.fillStyle = '#0a0a0a';
        sCtx.fillRect(12, 8, 16, 2);
    }
    if (type === 'Mud' && !isEnemy) {
        // Thick armor plates
        sCtx.fillStyle = darkenColor(color, 50);
        sCtx.fillRect(12, 12, 4, 6);
        sCtx.fillRect(20, 12, 4, 6);
    }

    return sCanvas;
}

function darkenColor(hex, amount) {
    let r = parseInt(hex.slice(1,3), 16) - amount;
    let g = parseInt(hex.slice(3,5), 16) - amount;
    let b = parseInt(hex.slice(5,7), 16) - amount;
    r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);
    return `rgb(${r},${g},${b})`;
}

function createScavengerCanvas() {
    const sCanvas = document.createElement('canvas');
    sCanvas.width = 20; sCanvas.height = 28;
    const sCtx = sCanvas.getContext('2d');

    // Body/armor
    sCtx.fillStyle = "#555";
    sCtx.fillRect(3, 10, 14, 12);

    // Head
    sCtx.fillStyle = "#ffdbac";
    sCtx.fillRect(5, 2, 10, 9);

    // Helmet
    sCtx.fillStyle = "#777";
    sCtx.fillRect(4, 1, 12, 5);

    // Eyes
    sCtx.fillStyle = "black";
    sCtx.fillRect(7, 5, 2, 2);
    sCtx.fillRect(11, 5, 2, 2);

    // Shield on left arm
    sCtx.fillStyle = "#8B4513";
    sCtx.fillRect(0, 12, 5, 8);
    sCtx.fillStyle = "#a0522d";
    sCtx.fillRect(1, 13, 3, 6);

    // Legs
    sCtx.fillStyle = "#444";
    sCtx.fillRect(4, 22, 4, 6);
    sCtx.fillRect(12, 22, 4, 6);

    return sCanvas;
}

const scavengerSprite = createScavengerCanvas();

// --- Collectibles ---
class HealthHeart {
    constructor(platform) {
        this.x = platform.x + 20 + Math.random() * (platform.w - 40);
        this.y = platform.y - 15;
        this.w = 14; this.h = 14;
        this.collected = false;
        this.bobOffset = Math.random() * Math.PI * 2;
    }
    draw() {
        if (this.collected) return;
        const bob = Math.sin(Date.now() * 0.003 + this.bobOffset) * 3;
        const sx = this.x - camera.x;
        const sy = this.y - camera.y + bob;
        // Draw heart shape
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 4, 4, 0, Math.PI * 2);
        ctx.arc(sx + 10, sy + 4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx, sy + 6);
        ctx.lineTo(sx + 7, sy + 14);
        ctx.lineTo(sx + 14, sy + 6);
        ctx.fill();
    }
}

class FireOrb {
    constructor(platform) {
        this.x = platform.x + 20 + Math.random() * (platform.w - 40);
        this.y = platform.y - 15;
        this.w = 14; this.h = 14;
        this.collected = false;
        this.bobOffset = Math.random() * Math.PI * 2;
    }
    draw() {
        if (this.collected) return;
        const bob = Math.sin(Date.now() * 0.004 + this.bobOffset) * 3;
        const sx = this.x - camera.x;
        const sy = this.y - camera.y + bob;
        // Orange glowing orb
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();
        ctx.arc(sx + 7, sy + 7, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(sx + 7, sy + 6, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(sx + 7, sy + 5, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// --- Projectile ---
class Projectile {
    constructor(x, y, vx, vy, color, owner, radius, piercing, freeze) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.owner = owner;
        this.radius = radius || 4; this.life = 100;
        this.piercing = piercing || false;
        this.freeze = freeze || false;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // Glow effect for larger projectiles
        if (this.radius >= 6) {
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(this.x - camera.x, this.y - camera.y, this.radius + 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }
}

// --- Scavenger ---
class Scavenger {
    constructor(platform) {
        this.w = 20; this.h = 28;
        this.platform = platform;
        this.x = platform.x + Math.random() * (platform.w - this.w);
        this.y = platform.y - this.h;
        this.hp = 20;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.patrolSpeed = 0.5;
        this.frozen = 0;
    }
    update() {
        if (this.frozen > 0) {
            this.frozen--;
            return;
        }
        this.x += this.direction * this.patrolSpeed;
        // Reverse at platform edges
        if (this.x <= this.platform.x) {
            this.x = this.platform.x;
            this.direction = 1;
        }
        if (this.x + this.w >= this.platform.x + this.platform.w) {
            this.x = this.platform.x + this.platform.w - this.w;
            this.direction = -1;
        }
    }
    draw() {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        if (this.frozen > 0) {
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(sx - 1, sy - 1, this.w + 2, this.h + 2);
        }

        ctx.save();
        if (this.direction < 0) {
            ctx.translate(sx + this.w, sy);
            ctx.scale(-1, 1);
            ctx.drawImage(scavengerSprite, 0, 0);
        } else {
            ctx.drawImage(scavengerSprite, sx, sy);
        }
        ctx.restore();

        // Sword
        ctx.strokeStyle = "silver";
        ctx.lineWidth = 2;
        const swordX = this.direction > 0 ? sx + this.w : sx;
        const swordDir = this.direction > 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(swordX, sy + 15);
        ctx.lineTo(swordX + 12 * swordDir, sy + 5);
        ctx.stroke();

        ctx.globalAlpha = 1.0;

        // HP bar
        ctx.fillStyle = "black";
        ctx.fillRect(sx, sy - 6, this.w, 3);
        ctx.fillStyle = "red";
        ctx.fillRect(sx, sy - 6, this.w * (this.hp / 20), 3);
    }
}

// --- Fortress Boss ---
class Fortress {
    constructor(x) {
        this.x = x; this.y = 50;
        this.w = 200; this.h = 350;
        this.hp = 1000; this.maxHp = 1000;
        this.turrets = [
            { x: x + 20, y: 100, timer: 0, interval: 80 },
            { x: x + 100, y: 70, timer: 30, interval: 60 },
            { x: x + 180, y: 100, timer: 60, interval: 80 }
        ];
        this.defeated = false;
    }
    update() {
        if (this.defeated) return;
        const target = playerTeam[0];
        if (!target) return;

        this.turrets.forEach(t => {
            t.timer++;
            if (t.timer >= t.interval) {
                t.timer = 0;
                const dx = target.x - t.x;
                const dy = target.y - t.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 0 && dist < 800) {
                    const speed = 4;
                    projectiles.push(new Projectile(
                        t.x, t.y,
                        (dx / dist) * speed, (dy / dist) * speed,
                        '#ff0000', 'enemy', 5
                    ));
                }
            }
        });
    }
    draw() {
        if (this.defeated) return;
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        // Main structure
        ctx.fillStyle = '#555';
        ctx.fillRect(sx, sy, this.w, this.h);

        // Stone texture lines
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        for (let row = 0; row < this.h; row += 20) {
            ctx.beginPath();
            ctx.moveTo(sx, sy + row);
            ctx.lineTo(sx + this.w, sy + row);
            ctx.stroke();
        }

        // Battlements
        for (let i = 0; i < this.w; i += 25) {
            ctx.fillStyle = '#666';
            ctx.fillRect(sx + i, sy - 15, 15, 15);
        }

        // Turrets
        this.turrets.forEach(t => {
            const tx = t.x - camera.x;
            const ty = t.y - camera.y;
            ctx.fillStyle = '#777';
            ctx.fillRect(tx - 10, ty - 5, 20, 15);
            ctx.fillStyle = '#333';
            ctx.fillRect(tx - 3, ty + 5, 6, 10);
        });

        // Gate
        ctx.fillStyle = '#3a2010';
        ctx.fillRect(sx + 75, sy + this.h - 80, 50, 80);
        ctx.fillStyle = '#2a1505';
        ctx.fillRect(sx + 80, sy + this.h - 75, 40, 75);

        // Boss health bar at top of screen
        const barW = canvas.width - 100;
        const barH = 20;
        const barX = 50;
        const barY = 10;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(barX, barY, barW * (this.hp / this.maxHp), barH);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SCAVENGER FORTRESS', canvas.width / 2, barY + 15);
        ctx.textAlign = 'left';
    }
    takeDamage(amount) {
        this.hp -= amount;
        screenShake = 5;
        if (this.hp <= 0) {
            this.defeated = true;
            // Explosion particles
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(
                    this.x + Math.random() * this.w,
                    this.y + Math.random() * this.h,
                    (Math.random() - 0.5) * 6,
                    (Math.random() - 0.5) * 6,
                    ['#ff6b6b', '#ffa502', '#ff4757', '#eccc68'][Math.floor(Math.random() * 4)],
                    30 + Math.random() * 30
                ));
            }
        }
    }
}

// --- Dragon Boss (Final Boss - Volcano) ---
class DragonBoss {
    constructor(x) {
        this.x = x; this.y = 100;
        this.w = 160; this.h = 100;
        this.hp = 1500; this.maxHp = 1500;
        this.defeated = false;
        this.vx = 0; this.vy = 0;
        this.phase = 1; // Phase 2 at 50% HP
        this.wingAngle = 0;
        this.breathTimer = 0;
        this.breathCooldown = 90;
        this.swoopTimer = 0;
        this.swoopCooldown = 300;
        this.isSwooping = false;
        this.swoopTargetY = 0;
        this.baseY = 100;
        this.moveDir = 1;
        this.sprite = this.createBossSprite();
    }

    createBossSprite() {
        const s = document.createElement('canvas');
        s.width = 160; s.height = 100;
        const c = s.getContext('2d');

        // Giant dragon body - dark crimson
        c.fillStyle = '#8b0000';
        c.fillRect(30, 35, 80, 35); // Torso

        // Belly scales
        c.fillStyle = '#cc4400';
        c.fillRect(35, 55, 70, 12);

        // Neck
        c.fillStyle = '#8b0000';
        c.fillRect(105, 20, 20, 30);

        // Head
        c.fillStyle = '#a00000';
        c.fillRect(115, 10, 35, 28);

        // Jaw
        c.fillStyle = '#700000';
        c.fillRect(120, 32, 30, 10);

        // Teeth
        c.fillStyle = '#fff';
        for (let i = 0; i < 5; i++) {
            c.fillRect(122 + i * 6, 30, 3, 5);
        }

        // Eye - glowing
        c.fillStyle = '#ff4500';
        c.fillRect(135, 15, 8, 6);
        c.fillStyle = '#ffff00';
        c.fillRect(137, 16, 4, 4);

        // Horns
        c.fillStyle = '#333';
        c.fillRect(125, 4, 4, 10);
        c.fillRect(135, 2, 4, 12);
        c.fillRect(143, 5, 4, 9);

        // Tail
        c.fillStyle = '#8b0000';
        c.fillRect(5, 40, 30, 15);
        c.fillRect(0, 38, 12, 10);
        // Tail spikes
        c.fillStyle = '#600';
        c.fillRect(0, 34, 6, 6);
        c.fillRect(8, 36, 5, 5);

        // Back spines
        c.fillStyle = '#ff4500';
        c.fillRect(40, 28, 5, 10);
        c.fillRect(52, 25, 5, 13);
        c.fillRect(64, 27, 5, 11);
        c.fillRect(76, 28, 5, 10);
        c.fillRect(88, 30, 5, 8);

        // Legs
        c.fillStyle = '#700000';
        c.fillRect(45, 68, 10, 20);
        c.fillRect(85, 68, 10, 20);
        // Claws
        c.fillStyle = '#333';
        c.fillRect(42, 85, 5, 5);
        c.fillRect(49, 85, 5, 5);
        c.fillRect(82, 85, 5, 5);
        c.fillRect(89, 85, 5, 5);

        return s;
    }

    update() {
        if (this.defeated) return;
        const target = playerTeam[0];
        if (!target) return;

        // Phase check
        if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
            this.phase = 2;
            this.breathCooldown = 50;
            screenShake = 10;
        }

        // Hovering movement
        this.vy = Math.sin(Date.now() * 0.002) * 0.5;
        this.x += this.moveDir * (this.phase === 2 ? 1.5 : 0.8);
        this.y += this.vy;

        // Reverse at level boundaries
        if (this.x > LEVEL_LENGTH - 100) this.moveDir = -1;
        if (this.x < LEVEL_LENGTH - 800) this.moveDir = 1;

        // Keep in bounds vertically
        if (this.y < 30) this.y = 30;
        if (this.y > 250) this.y = 250;

        // Swoop attack in phase 2
        if (this.phase === 2) {
            this.swoopTimer++;
            if (this.swoopTimer >= this.swoopCooldown && !this.isSwooping) {
                this.isSwooping = true;
                this.swoopTargetY = target.y;
                this.swoopTimer = 0;
            }
            if (this.isSwooping) {
                this.y += (this.swoopTargetY - this.y) * 0.08;
                if (Math.abs(this.y - this.swoopTargetY) < 10) {
                    this.isSwooping = false;
                    this.baseY = 100;
                }
            }
        }

        // Fire breath attack
        this.breathTimer++;
        if (this.breathTimer >= this.breathCooldown) {
            this.breathTimer = 0;
            this.fireBreath(target);
        }

        // Body collision damage
        playerTeam.forEach(d => {
            if (d.x < this.x + this.w && d.x + d.w > this.x &&
                d.y < this.y + this.h && d.y + d.h > this.y) {
                d.hp -= 0.5;
            }
        });
    }

    fireBreath(target) {
        const mouthX = this.x + this.w - 10;
        const mouthY = this.y + 35;
        const dx = target.x - mouthX;
        const dy = target.y - mouthY;
        const dist = Math.hypot(dx, dy);
        if (dist === 0) return;

        const speed = 5;
        const count = this.phase === 2 ? 7 : 5;
        const spread = this.phase === 2 ? 25 : 18;

        // Fire a cone of large fireballs
        for (let i = 0; i < count; i++) {
            const angle = Math.atan2(dy, dx) + ((i - Math.floor(count / 2)) * spread * Math.PI / 180);
            const bvx = Math.cos(angle) * speed;
            const bvy = Math.sin(angle) * speed;
            projectiles.push(new Projectile(
                mouthX, mouthY, bvx, bvy,
                '#ff4500', 'enemy', 10
            ));
        }

        // Fire breath particles
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle(
                mouthX, mouthY,
                (dx / dist) * 4 + (Math.random() - 0.5) * 4,
                (dy / dist) * 4 + (Math.random() - 0.5) * 4,
                ['#ff4500', '#ff6347', '#ffa500', '#ffff00'][Math.floor(Math.random() * 4)],
                20 + Math.random() * 20
            ));
        }
        screenShake = 3;
    }

    draw() {
        if (this.defeated) return;
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);

        // Wing flapping
        this.wingAngle = Math.sin(Date.now() * 0.005) * 20;

        // Giant wings
        ctx.fillStyle = 'rgba(139, 0, 0, 0.6)';
        // Left wing
        ctx.beginPath();
        ctx.moveTo(40, 35);
        ctx.lineTo(10, 35 + this.wingAngle - 40);
        ctx.lineTo(70, 35 + this.wingAngle - 25);
        ctx.closePath();
        ctx.fill();
        // Right wing
        ctx.beginPath();
        ctx.moveTo(80, 35);
        ctx.lineTo(110, 35 + this.wingAngle - 40);
        ctx.lineTo(50, 35 + this.wingAngle - 25);
        ctx.closePath();
        ctx.fill();

        // Wing membrane detail
        ctx.strokeStyle = 'rgba(100, 0, 0, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(40, 35);
        ctx.lineTo(30, 35 + this.wingAngle - 30);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(50, 35);
        ctx.lineTo(20, 35 + this.wingAngle - 35);
        ctx.stroke();

        // Draw sprite
        ctx.drawImage(this.sprite, 0, 0);

        // Glow effect when in phase 2
        if (this.phase === 2) {
            ctx.globalAlpha = 0.15 + Math.sin(Date.now() * 0.01) * 0.1;
            ctx.fillStyle = '#ff4500';
            ctx.fillRect(-5, -5, this.w + 10, this.h + 10);
            ctx.globalAlpha = 1.0;
        }

        ctx.restore();

        // Boss health bar at top of screen
        const barW = canvas.width - 100;
        const barH = 20;
        const barX = 50;
        const barY = 10;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, barY, barW, barH);

        // Two-tone health bar (changes color in phase 2)
        const hpRatio = this.hp / this.maxHp;
        const barColor = this.phase === 2 ? '#ff4500' : '#c0392b';
        ctx.fillStyle = barColor;
        ctx.fillRect(barX, barY, barW * hpRatio, barH);

        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        const label = this.phase === 2 ? 'INFERNAL DRAGON - ENRAGED' : 'INFERNAL DRAGON';
        ctx.fillText(label, canvas.width / 2, barY + 15);
        ctx.textAlign = 'left';
    }

    takeDamage(amount) {
        this.hp -= amount;
        screenShake = 3;
        if (this.hp <= 0) {
            this.defeated = true;
            // Massive explosion
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(
                    this.x + Math.random() * this.w,
                    this.y + Math.random() * this.h,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    ['#ff4500', '#ff6347', '#ffa500', '#ffff00', '#8b0000'][Math.floor(Math.random() * 5)],
                    40 + Math.random() * 40
                ));
            }
            screenShake = 15;
        }
    }
}

// --- Dragon ---
class Dragon {
    constructor(x, y, type, isPlayer = false, isEnemy = false) {
        this.x = x; this.y = y; this.vx = 0; this.vy = 0;
        this.w = 40; this.h = 30;
        this.type = type; this.isPlayer = isPlayer; this.isEnemy = isEnemy;

        const stats = TRIBE_STATS[type] || TRIBE_STATS['Sky'];
        this.maxHp = isEnemy ? 60 : stats.maxHp;
        this.hp = this.maxHp;
        this.speed = isEnemy ? 0.6 : stats.speed;
        this.shootCooldownMax = isEnemy ? 60 : stats.shootCooldown;
        this.projColor = isEnemy ? 'red' : stats.projColor;
        this.projRadius = isEnemy ? 4 : stats.projRadius;
        this.projPiercing = !isEnemy && (stats.piercing || false);
        this.projFreeze = !isEnemy && (stats.freeze || false);
        this.meleeImmune = !isEnemy && (stats.meleeImmune || false);

        this.shootTimer = 0;
        this.frozen = 0;
        this.tripleShotTimer = 0;

        this.sprite = createDragonCanvas(type, isEnemy);
        this.wingAngle = 0;
    }

    shoot() {
        const stats = TRIBE_STATS[this.type] || TRIBE_STATS['Sky'];
        const px = this.x + this.w;
        const py = this.y + this.h / 2;
        const speed = 10;

        const fireProjectile = (angle) => {
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            projectiles.push(new Projectile(
                px, py, vx, vy,
                this.projColor, 'player',
                this.projRadius, this.projPiercing, this.projFreeze
            ));
        };

        if (this.tripleShotTimer > 0) {
            fireProjectile(0);
            fireProjectile(15 * Math.PI / 180);
            fireProjectile(-15 * Math.PI / 180);
        } else {
            fireProjectile(0);
        }

        spawnFireParticles(px, py, this.projColor, 5);
        this.shootTimer = this.shootCooldownMax;
    }

    update() {
        if (levelTransitioning) return;
        if (this.frozen > 0) {
            this.frozen--;
            this.vx *= 0.5;
            this.vy *= 0.5;
        }
        if (this.tripleShotTimer > 0) this.tripleShotTimer--;

        if (this.isPlayer) {
            if (keys['ArrowUp'] || keys['w']) this.vy -= this.speed;
            if (keys['ArrowDown'] || keys['s']) this.vy += this.speed;
            if (keys['ArrowLeft'] || keys['a']) this.vx -= this.speed;
            if (keys['ArrowRight'] || keys['d']) this.vx += this.speed;

            if (keys[' '] && this.shootTimer <= 0) {
                this.shoot();
            }
        } else if (this.isEnemy) {
            let target = playerTeam[0];
            if (target) {
                let dist = Math.hypot(target.x - this.x, target.y - this.y);
                if (dist < 400) {
                    this.vx += (target.x - this.x) * 0.005;
                    this.vy += (target.y - this.y) * 0.005;
                    if (this.shootTimer <= 0) {
                        const dx = target.x - this.x;
                        const dy = target.y - this.y;
                        const d = Math.hypot(dx, dy);
                        projectiles.push(new Projectile(
                            this.x, this.y + this.h / 2,
                            (dx / d) * 7, (dy / d) * 7,
                            "red", "enemy", 4
                        ));
                        this.shootTimer = this.shootCooldownMax;
                    }
                }
            }
        } else {
            // AI Ally follow
            let leader = playerTeam[0];
            if (leader) {
                let idx = playerTeam.indexOf(this);
                let targetX = leader.x - 50 - (idx * 30);
                let targetY = leader.y + (idx % 2 === 0 ? -30 : 30);
                this.vx += (targetX - this.x) * 0.02;
                this.vy += (targetY - this.y) * 0.02;
                // Allies also shoot nearby enemies
                if (this.shootTimer <= 0) {
                    for (let e of enemies) {
                        let dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < 300) {
                            const dx = e.x - this.x;
                            const dy = e.y - this.y;
                            const d = Math.hypot(dx, dy);
                            projectiles.push(new Projectile(
                                this.x + this.w, this.y + this.h / 2,
                                (dx / d) * 8, (dy / d) * 8,
                                this.projColor, 'player',
                                this.projRadius, this.projPiercing, this.projFreeze
                            ));
                            this.shootTimer = this.shootCooldownMax + 10;
                            break;
                        }
                    }
                }
            }
        }

        if (this.shootTimer > 0) this.shootTimer--;
        this.vx *= FRICTION; this.vy *= FRICTION; this.vy += GRAVITY;
        this.x += this.vx; this.y += this.vy;

        let onPlatform = false;
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x &&
                this.y + this.h > p.y && this.y + this.h < p.y + p.h + 5 && this.vy >= 0) {
                this.y = p.y - this.h; this.vy = 0;
                onPlatform = true;
                if (this.hp < this.maxHp && !this.isEnemy) this.hp += 0.15;
            }
        });

        if (this.y < 0) this.y = 0;
        if (this.y > canvas.height - this.h) this.y = canvas.height - this.h;
    }

    draw() {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.vy * 0.05);
        const flapSpeed = 0.1 + (Math.abs(this.vx) + Math.abs(this.vy)) * 0.05;
        this.wingAngle = Math.sin(Date.now() * flapSpeed) * 15;

        // Wings
        const wingColor = this.isEnemy ? 'rgba(255,100,100,0.4)' : 'rgba(255,255,255,0.3)';
        ctx.fillStyle = wingColor;
        // Upper wing
        ctx.beginPath();
        ctx.moveTo(15, 10);
        ctx.lineTo(10, 10 + this.wingAngle - 8);
        ctx.lineTo(25, 10 + this.wingAngle - 5);
        ctx.closePath();
        ctx.fill();
        // Lower wing hint
        ctx.fillStyle = wingColor;
        ctx.fillRect(15, 10 - this.wingAngle * 0.3, 12, 3);

        ctx.drawImage(this.sprite, 0, 0);

        // Frozen overlay
        if (this.frozen > 0) {
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(0, 0, this.w, this.h);
            ctx.globalAlpha = 1.0;
        }

        // Triple shot indicator
        if (this.tripleShotTimer > 0 && this.isPlayer) {
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(this.w / 2, -5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.restore();

        // HP Bar
        ctx.fillStyle = "black";
        ctx.fillRect(sx, sy - 15, this.w, 5);
        ctx.fillStyle = this.isEnemy ? "red" : (this.isPlayer ? "#f1c40f" : "#2ecc71");
        ctx.fillRect(sx, sy - 15, this.w * (this.hp / this.maxHp), 5);
    }
}

function generateLevel() {
    platforms = []; enemies = []; projectiles = []; collectibles = [];
    cloudLayers = []; hillLayers = [];
    fortress = null;
    dragonBoss = null;
    particles = [];
    const biome = BIOMES[currentBiomeIndex];

    // Cloud layer (10% parallax)
    for (let i = 0; i < 15; i++) {
        cloudLayers.push({
            x: i * 600 + Math.random() * 200,
            y: 20 + Math.random() * 80,
            w: 80 + Math.random() * 120,
            h: 20 + Math.random() * 30,
            color: biome.cloud
        });
    }

    // Hill layer (40% parallax)
    for (let i = 0; i < 20; i++) {
        hillLayers.push({
            x: i * 400,
            w: 500,
            h: 100 + Math.random() * 200,
            color: biome.secondary
        });
    }

    playerTeam.forEach((d, i) => { d.x = 100 - (i * 40); d.y = 200; d.vx = 0; d.vy = 0; });

    const levelLen = (currentBiomeIndex === 2 && !fortress) ? LEVEL_LENGTH + 400 : LEVEL_LENGTH;

    for (let i = 0; i < levelLen / 300; i++) {
        let p = { x: i * 350 + 300, y: 250 + Math.random() * 150, w: 150 + Math.random() * 100, h: 20 };
        platforms.push(p);
        if (Math.random() > 0.4) enemies.push(new Scavenger(p));
        if (Math.random() > 0.7) enemies.push(new Dragon(p.x, p.y - 200, "Enemy", false, true));

        // Collectibles
        if (Math.random() > 0.75) {
            collectibles.push(new HealthHeart(p));
        }
        if (Math.random() > 0.88) {
            collectibles.push(new FireOrb(p));
        }
    }

    // Boss at Mountains (level 3, index 2)
    if (currentBiomeIndex === 2) {
        fortress = new Fortress(LEVEL_LENGTH - 300);
    }

    // Final Boss at Volcano (level 5, index 4)
    if (currentBiomeIndex === 4) {
        dragonBoss = new DragonBoss(LEVEL_LENGTH - 400);
    }
}

const keys = {};
window.onkeydown = (e) => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); };
window.onkeyup = (e) => keys[e.key] = false;

function startGame(type) {
    document.getElementById('menu').style.display = 'none';
    currentBiomeIndex = 0; gameState = "PLAY";

    // Pick two different ally types from unlocked
    const unlocked = getUnlockedTribes().filter(t => t !== type);
    const ally1Type = unlocked[0] || 'Sea';
    const ally2Type = unlocked[1] || unlocked[0] || 'Mud';

    playerTeam = [
        new Dragon(100, 200, type, true),
        new Dragon(40, 180, ally1Type),
        new Dragon(40, 220, ally2Type)
    ];
    generateLevel();
    gameLoop();
}

function updateCombat() {
    for (let pi = projectiles.length - 1; pi >= 0; pi--) {
        const p = projectiles[pi];
        p.update();
        if (p.life <= 0) { projectiles.splice(pi, 1); continue; }

        let removed = false;

        if (p.owner === "player") {
            // Hit fortress
            if (fortress && !fortress.defeated) {
                if (p.x > fortress.x && p.x < fortress.x + fortress.w &&
                    p.y > fortress.y && p.y < fortress.y + fortress.h) {
                    fortress.takeDamage(10);
                    if (!p.piercing) { projectiles.splice(pi, 1); removed = true; }
                }
            }
            if (removed) continue;

            // Hit dragon boss
            if (dragonBoss && !dragonBoss.defeated) {
                if (p.x > dragonBoss.x && p.x < dragonBoss.x + dragonBoss.w &&
                    p.y > dragonBoss.y && p.y < dragonBoss.y + dragonBoss.h) {
                    dragonBoss.takeDamage(10);
                    if (!p.piercing) { projectiles.splice(pi, 1); removed = true; }
                }
            }
            if (removed) continue;

            // Hit enemies
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const en = enemies[ei];
                if (p.x > en.x && p.x < en.x + en.w && p.y > en.y && p.y < en.y + en.h) {
                    en.hp -= 10;
                    if (p.freeze && en.frozen !== undefined) {
                        en.frozen = 180; // 3 seconds at 60fps
                    }
                    if (!p.piercing) { projectiles.splice(pi, 1); removed = true; }
                    if (en.hp <= 0) {
                        // Death particles
                        spawnFireParticles(en.x + en.w / 2, en.y + en.h / 2, '#ff6b6b', 8);
                        enemies.splice(ei, 1);
                    }
                    if (removed) break;
                }
            }
        } else {
            // Enemy projectile hitting player team
            for (let di = 0; di < playerTeam.length; di++) {
                const d = playerTeam[di];
                if (p.x > d.x && p.x < d.x + d.w && p.y > d.y && p.y < d.y + d.h) {
                    d.hp -= 5;
                    projectiles.splice(pi, 1);
                    removed = true;
                    break;
                }
            }
        }
    }

    // Scavenger Melee check
    enemies.forEach(en => {
        if (en instanceof Scavenger) {
            playerTeam.forEach(d => {
                let dist = Math.hypot(d.x - en.x, d.y - en.y);
                if (dist < 40 && !d.meleeImmune) {
                    d.hp -= 0.2;
                }
            });
        }
    });

    // Collectible pickup
    const player = playerTeam[0];
    if (player) {
        collectibles.forEach(c => {
            if (c.collected) return;
            if (player.x < c.x + c.w && player.x + player.w > c.x &&
                player.y < c.y + c.h && player.y + player.h > c.y) {
                c.collected = true;
                if (c instanceof HealthHeart) {
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                    spawnFireParticles(c.x, c.y, '#e74c3c', 6);
                } else if (c instanceof FireOrb) {
                    player.tripleShotTimer = 300; // 5 seconds at 60fps
                    spawnFireParticles(c.x, c.y, '#f39c12', 8);
                }
            }
        });
    }
}

function drawTransitionOverlay() {
    if (!levelTransitioning) return;
    const progress = transitionTimer / 90; // 1.5 seconds = 90 frames
    let alpha;
    if (progress < 0.3) {
        alpha = progress / 0.3;
    } else if (progress > 0.7) {
        alpha = (1 - progress) / 0.3;
    } else {
        alpha = 1;
    }

    ctx.fillStyle = `rgba(0, 0, 0, ${alpha * 0.85})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'white';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Entering ${transitionBiomeName}...`, canvas.width / 2, canvas.height / 2);
    ctx.font = '16px sans-serif';
    ctx.fillText('Prepare yourself', canvas.width / 2, canvas.height / 2 + 40);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1.0;
}

function checkBiomeUnlocks() {
    // Unlock Ice at Swamp clear (index 1 -> 2)
    if (currentBiomeIndex === 2) unlockTribe('Ice');
    // Unlock Night at Snow clear (index 3 -> 4)
    if (currentBiomeIndex === 4) unlockTribe('Night');
}

function gameLoop() {
    if (gameState !== "PLAY") return;
    const biome = BIOMES[currentBiomeIndex];

    // Update camera
    if (playerTeam[0]) camera.update(playerTeam[0]);

    // Screen shake
    let shakeX = 0, shakeY = 0;
    if (screenShake > 0) {
        shakeX = (Math.random() - 0.5) * screenShake * 2;
        shakeY = (Math.random() - 0.5) * screenShake * 2;
        screenShake -= 0.5;
        if (screenShake < 0) screenShake = 0;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Background
    ctx.fillStyle = biome.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Cloud layer (10% parallax)
    ctx.globalAlpha = 0.2;
    cloudLayers.forEach(c => {
        ctx.fillStyle = c.color;
        // Rounded cloud shape
        const cx = c.x - (camera.x * 0.1);
        ctx.beginPath();
        ctx.ellipse(cx + c.w / 2, c.y + c.h / 2, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Secondary puff
        ctx.beginPath();
        ctx.ellipse(cx + c.w * 0.3, c.y + c.h * 0.3, c.w * 0.3, c.h * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Hill layer (40% parallax)
    ctx.globalAlpha = 0.3;
    hillLayers.forEach(l => {
        ctx.fillStyle = l.color;
        ctx.fillRect(l.x - (camera.x * 0.4), canvas.height - l.h, l.w, l.h);
    });
    ctx.globalAlpha = 1.0;

    // Platforms
    ctx.fillStyle = biome.platform;
    platforms.forEach(p => {
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.w, p.h);
        // Platform top highlight
        ctx.fillStyle = biome.secondary;
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.w, 3);
        ctx.fillStyle = biome.platform;
    });

    // Collectibles
    collectibles.forEach(c => c.draw());

    // Fortress
    if (fortress) {
        fortress.update();
        fortress.draw();
    }

    // Dragon Boss
    if (dragonBoss) {
        dragonBoss.update();
        dragonBoss.draw();
    }

    // Level transition check (handle before combat update)
    if (!levelTransitioning && playerTeam[0]) {
        let canAdvance = true;
        if (currentBiomeIndex === 2) canAdvance = fortress && fortress.defeated;
        if (currentBiomeIndex === 4) canAdvance = dragonBoss && dragonBoss.defeated;

        if (playerTeam[0].x > LEVEL_LENGTH && canAdvance) {
            levelTransitioning = true;
            transitionTimer = 0;
            currentBiomeIndex++;
            checkBiomeUnlocks();

            if (currentBiomeIndex >= BIOMES.length) {
                transitionBiomeName = "Victory";
            } else {
                transitionBiomeName = BIOMES[currentBiomeIndex].name;
            }
        }
    }

    if (levelTransitioning) {
        transitionTimer++;
        if (transitionTimer >= 90) { // 1.5 seconds
            levelTransitioning = false;
            if (currentBiomeIndex >= BIOMES.length) {
                alert("Victory! All biomes conquered!");
                location.reload();
                return;
            }
            generateLevel();
        }
    }

    updateCombat();
    enemies.forEach(en => { if (en.update) en.update(); en.draw(); });
    projectiles.forEach(p => p.draw());

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    for (let i = playerTeam.length - 1; i >= 0; i--) {
        let d = playerTeam[i]; d.update(); d.draw();
        if (d.hp <= 0) {
            spawnFireParticles(d.x + d.w / 2, d.y + d.h / 2, TRIBE_STATS[d.type]?.color || '#fff', 15);
            playerTeam.splice(i, 1);
            if (playerTeam.length > 0) {
                playerTeam[0].isPlayer = true;
            } else {
                alert("The flight has fallen...");
                location.reload();
                return;
            }
        }
    }

    ctx.restore(); // End screen shake

    // Draw transition overlay on top (outside shake)
    drawTransitionOverlay();

    // HUD
    if (playerTeam[0]) {
        document.getElementById('hp-val').innerText = Math.floor(playerTeam[0].hp);
        document.getElementById('lives-val').innerText = playerTeam.length;
        document.getElementById('biome-val').innerText = biome.name;
    }

    requestAnimationFrame(gameLoop);
}

// Initialize menu
buildMenu();
