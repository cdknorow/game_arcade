<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino City Destruction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameCanvas {
            border: 2px solid #e94560;
            background: #16213e;
            image-rendering: pixelated;
        }
        #ui {
            color: #e94560;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }
        #message {
            color: #fff;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="ui">DINO CITY DESTRUCTION</div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="message">YOU are the dinosaur. Arrow keys to move, Up to jump, Space to attack!</div>
    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');

const messages = [
    "The dinosaurs are coming... wait, is that the military?",
    "The soldiers showed up! About time!",
    "The mayor finally approved the defense budget.",
    "Small arms vs giant dinosaurs. Bold strategy.",
    "The soldiers are... actually trying?",
    "Those tiny bullets don't seem to bother the dinos much.",
    "Send more soldiers! These ones keep getting stepped on!",
    "Insurance still doesn't cover dinosaur attacks.",
    "The soldiers are brave. Not smart, but brave.",
    "Narrator: The defense was... an attempt.",
    "Todd from accounting volunteered. He lasted 3 seconds.",
    "The dinosaurs seem mildly annoyed by the bullets.",
    "This is slightly less fine than before.",
    "Where did these dinosaurs even come from?",
    "City budget for dinosaur defense: $12.50.",
    "Soldier morale: questionable. Soldier aim: also questionable.",
    "The soldiers' training did NOT cover this.",
    "Reinforcements arriving! (They also look nervous.)",
    "At least someone is doing SOMETHING now.",
    "The dinosaurs seem offended that anyone would resist.",
    "IS THAT A JET?! THE AIR FORCE IS HERE!",
    "Missiles vs dinosaurs. Now we're talking.",
    "The jets cost $50 million each. The city is worth $12.",
    "The pilots are having WAY too much fun.",
    "MISSILE LOCK ACQUIRED. Fox two!",
    "The dinos did NOT see that coming.",
    "Air support requested. Air support GRANTED.",
    "Each missile costs more than a soldier's yearly salary.",
    "DID THAT DINOSAUR JUST SPIT A TOOTH AT A JET?!",
    "The dinos have anti-air capabilities. We're doomed.",
    "Dinosaur dental plan: weaponize everything.",
    "Those teeth grow back. The jets do not.",
];

// Colors
const SKY_TOP = '#0f3460';
const SKY_BOT = '#16213e';
const GROUND = '#533483';

// Buildings
let buildings = [];
let rubblePiles = [];
let dinos = [];
let particles = [];
let clouds = [];
let frameCount = 0;
let totalDestruction = 0;
let messageTimer = 0;
let currentMessage = 0;
let screenShake = 0;
let stars = [];
let soldiers = [];
let bullets = [];
let dinosKilled = 0;
let clawProjectiles = [];
let jets = [];
let missiles = [];
let toothProjectiles = [];
let playerDino = null;
const keys = {};
let playerShootCooldown = 0;

function init() {
    buildings = [];
    rubblePiles = [];
    dinos = [];
    particles = [];
    clouds = [];
    stars = [];
    soldiers = [];
    bullets = [];
    clawProjectiles = [];
    jets = [];
    missiles = [];
    toothProjectiles = [];
    playerShootCooldown = 0;
    totalDestruction = 0;
    dinosKilled = 0;
    currentMessage = 0;

    // Stars
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * 200,
            size: Math.random() * 2 + 0.5,
            twinkle: Math.random() * Math.PI * 2
        });
    }

    // Generate city
    let x = 30;
    while (x < canvas.width - 30) {
        const w = 30 + Math.random() * 50;
        const h = 80 + Math.random() * 200;
        const floors = Math.floor(h / 20);
        const color = [
            '#4a4e69', '#6b705c', '#4a5568', '#5c5470', '#3d405b',
            '#2b2d42', '#495057', '#343a40'
        ][Math.floor(Math.random() * 8)];

        buildings.push({
            x, y: canvas.height - 80 - h, w, h,
            color,
            floors,
            hp: floors * 2,
            maxHp: floors * 2,
            windows: generateWindows(w, h, floors),
            destroyed: false,
            crumbling: false,
            crumbleTimer: 0
        });
        x += w + 5 + Math.random() * 15;
    }

    // Clouds
    for (let i = 0; i < 5; i++) {
        clouds.push({
            x: Math.random() * canvas.width,
            y: 30 + Math.random() * 100,
            w: 60 + Math.random() * 80,
            speed: 0.2 + Math.random() * 0.3
        });
    }

    // Spawn player dino
    const pSize = 1.2;
    playerDino = {
        x: canvas.width / 2,
        y: canvas.height - 80 - 50 * pSize,
        groundY: canvas.height - 80 - 50 * pSize,
        dir: 1,
        size: pSize,
        speed: 2.5,
        state: 'walking',
        target: null,
        attackTimer: 0,
        animFrame: 0,
        animTimer: 0,
        jawOpen: 0,
        color: '#b71c1c',
        roarTimer: 0,
        tailWag: 0,
        hp: 80,
        maxHp: 80,
        clawCooldown: 0,
        soldierTarget: null,
        toothCooldown: 0,
        isPlayer: true,
        vy: 0,
        jumping: false
    };
    dinos.push(playerDino);

    // Spawn initial AI dinos
    spawnDino();
    setTimeout(spawnDino, 3000);

    // Spawn initial soldiers
    for (let i = 0; i < 3; i++) {
        spawnSoldier();
    }
}

function generateWindows(bw, bh, floors) {
    const wins = [];
    const cols = Math.max(1, Math.floor((bw - 10) / 12));
    for (let row = 0; row < floors; row++) {
        for (let col = 0; col < cols; col++) {
            wins.push({
                rx: 6 + col * 12,
                ry: 8 + row * 20,
                lit: Math.random() > 0.3,
                broken: false
            });
        }
    }
    return wins;
}

function spawnDino() {
    const fromLeft = Math.random() > 0.5;
    const size = 0.8 + Math.random() * 0.6;
    dinos.push({
        x: fromLeft ? -60 : canvas.width + 60,
        y: canvas.height - 80 - 50 * size,
        dir: fromLeft ? 1 : -1,
        size,
        speed: 0.3 + Math.random() * 0.5,
        state: 'walking', // walking, attacking, roaring
        target: null,
        attackTimer: 0,
        animFrame: 0,
        animTimer: 0,
        jawOpen: 0,
        color: ['#2d6a4f', '#40916c', '#52796f', '#774936', '#6b4226'][Math.floor(Math.random() * 5)],
        roarTimer: 0,
        tailWag: 0,
        hp: Math.floor(10 + size * 60),
        maxHp: Math.floor(10 + size * 60),
        clawCooldown: 0,
        soldierTarget: null,
        toothCooldown: 0
    });
}

function spawnSoldier() {
    const x = 50 + Math.random() * (canvas.width - 100);
    soldiers.push({
        x,
        y: canvas.height - 80,
        dir: Math.random() > 0.5 ? 1 : -1,
        speed: 0.4 + Math.random() * 0.3,
        state: 'patrolling',
        target: null,
        shootCooldown: 0,
        hp: 3,
        animFrame: 0,
        animTimer: 0,
        remove: false
    });
}

function spawnJet() {
    const fromLeft = Math.random() > 0.5;
    const y = 40 + Math.random() * 80;
    jets.push({
        x: fromLeft ? -80 : canvas.width + 80,
        y,
        dir: fromLeft ? 1 : -1,
        speed: 2 + Math.random() * 1.5,
        missilesLeft: 2,
        missileCooldown: 0,
        hasFired: false,
        afterburner: 0,
        remove: false,
        crashing: false,
        crashAngle: 0,
        crashVy: 0,
        smokeTimer: 0
    });
}

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height - 80);
    grad.addColorStop(0, SKY_TOP);
    grad.addColorStop(1, SKY_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawStars() {
    stars.forEach(s => {
        const alpha = 0.5 + Math.sin(s.twinkle + frameCount * 0.02) * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
}

function drawGround() {
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
    ctx.fillStyle = '#6b2fa0';
    ctx.fillRect(0, canvas.height - 80, canvas.width, 3);
}

function drawClouds() {
    clouds.forEach(c => {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w / 2, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x - c.w * 0.2, c.y - 5, c.w * 0.3, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x + c.w * 0.2, c.y - 3, c.w * 0.25, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        c.x += c.speed;
        if (c.x > canvas.width + c.w) c.x = -c.w;
    });
}

function drawBuilding(b) {
    if (b.destroyed) return;

    const dmg = 1 - b.hp / b.maxHp;

    // Main structure
    ctx.fillStyle = b.color;
    if (b.crumbling) {
        // Shake while crumbling
        const shake = Math.sin(frameCount * 0.5) * b.crumbleTimer * 0.5;
        ctx.save();
        ctx.translate(shake, 0);
    }

    // Damaged top
    const topDamage = dmg * 20;
    ctx.fillRect(b.x, b.y + topDamage, b.w, b.h - topDamage);

    // Cracks
    if (dmg > 0.2) {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        const numCracks = Math.floor(dmg * 5);
        for (let i = 0; i < numCracks; i++) {
            const cx = b.x + (i + 1) * b.w / (numCracks + 1);
            const cy = b.y + b.h * 0.3 + i * 20;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 5, cy + 15);
            ctx.lineTo(cx - 3, cy + 30);
            ctx.stroke();
        }
    }

    // Windows
    b.windows.forEach(win => {
        if (win.ry < topDamage) return;
        if (win.broken) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
        } else if (win.lit) {
            ctx.fillStyle = `rgba(255,234,167,${0.6 + Math.sin(frameCount * 0.01 + win.rx) * 0.2})`;
        } else {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
        }
        ctx.fillRect(b.x + win.rx, b.y + win.ry, 8, 12);
    });

    if (b.crumbling) ctx.restore();
}

function drawRubble(r) {
    ctx.fillStyle = r.color;
    // Pile of debris
    for (let i = 0; i < r.pieces.length; i++) {
        const p = r.pieces[i];
        ctx.fillRect(r.x + p.x, r.y + p.y, p.w, p.h);
    }
}

function drawDino(d) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(d.dir * d.size, d.size);

    const bob = Math.sin(frameCount * 0.1) * 2;
    const legAnim = Math.sin(frameCount * 0.15) * 8;
    const tailWag = Math.sin(frameCount * 0.08) * 10;

    // Tail
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(-15, 10 + bob);
    ctx.lineTo(-50 + tailWag, -5 + bob);
    ctx.lineTo(-55 + tailWag, 5 + bob);
    ctx.lineTo(-15, 20 + bob);
    ctx.fill();

    // Back leg
    ctx.fillStyle = darken(d.color, 20);
    ctx.fillRect(-5, 30 + bob, 10, 20 + legAnim);
    ctx.fillRect(-5, 50 + bob + legAnim, 14, 6);

    // Front leg
    ctx.fillRect(20, 30 + bob, 10, 20 - legAnim);
    ctx.fillRect(20, 50 + bob - legAnim, 14, 6);

    // Body
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.ellipse(5, 15 + bob, 25, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = lighten(d.color, 30);
    ctx.beginPath();
    ctx.ellipse(8, 22 + bob, 15, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arms with claws
    ctx.fillStyle = d.color;
    ctx.fillRect(18, 12 + bob, 5, 8);
    // Claw on arm
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(20, 20 + bob);
    ctx.lineTo(26, 22 + bob);
    ctx.lineTo(20, 24 + bob);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(20, 18 + bob);
    ctx.lineTo(27, 19 + bob);
    ctx.lineTo(20, 21 + bob);
    ctx.fill();

    // Flash when shooting claw
    if (d.clawCooldown > 55) {
        ctx.fillStyle = 'rgba(231,76,60,0.6)';
        ctx.beginPath();
        ctx.arc(23, 20 + bob, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    // Head
    ctx.fillStyle = d.color;
    const headY = -10 + bob;
    ctx.beginPath();
    ctx.ellipse(30, headY, 15, 12, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Jaw (opens when attacking/roaring)
    const jawAngle = d.jawOpen * 0.3;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(30, headY + 5);
    ctx.lineTo(48, headY + 5 + jawAngle * 15);
    ctx.lineTo(42, headY + 10 + jawAngle * 15);
    ctx.lineTo(28, headY + 8);
    ctx.fill();

    // Teeth
    if (d.jawOpen > 0.2) {
        ctx.fillStyle = '#fff';
        for (let t = 0; t < 4; t++) {
            const tx = 32 + t * 4;
            ctx.fillRect(tx, headY + 3, 2, 3);
            ctx.fillRect(tx, headY + 7 + jawAngle * 10, 2, 3);
        }
    }

    // Mouth interior
    if (d.jawOpen > 0.3) {
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.ellipse(38, headY + 5 + jawAngle * 7, 6, 3 + jawAngle * 5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(35, headY - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(36, headY - 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(36.5, headY - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Spikes on back
    ctx.fillStyle = darken(d.color, 30);
    for (let i = 0; i < 5; i++) {
        const sx = -10 + i * 8;
        const sy = -2 + bob;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + 3, sy - 8);
        ctx.lineTo(sx + 6, sy);
        ctx.fill();
    }

    // Roar effect
    if (d.state === 'roaring') {
        ctx.strokeStyle = 'rgba(233,69,96,0.5)';
        ctx.lineWidth = 2;
        for (let r = 0; r < 3; r++) {
            const radius = 10 + r * 8 + Math.sin(frameCount * 0.2) * 3;
            ctx.beginPath();
            ctx.arc(40, headY, radius, -0.5, 0.5);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function darken(hex, amount) {
    const num = parseInt(hex.slice(1), 16);
    const r = Math.max(0, (num >> 16) - amount);
    const g = Math.max(0, ((num >> 8) & 0xff) - amount);
    const b = Math.max(0, (num & 0xff) - amount);
    return `rgb(${r},${g},${b})`;
}

function lighten(hex, amount) {
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (num >> 16) + amount);
    const g = Math.min(255, ((num >> 8) & 0xff) + amount);
    const b = Math.min(255, (num & 0xff) + amount);
    return `rgb(${r},${g},${b})`;
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 5 - 1,
            life: 30 + Math.random() * 30,
            size: 2 + Math.random() * 4,
            color: Math.random() > 0.5 ? color : '#e94560'
        });
    }
}

function addSmoke(x, y) {
    for (let i = 0; i < 3; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 20,
            y,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -0.5 - Math.random() * 1,
            life: 60 + Math.random() * 40,
            size: 5 + Math.random() * 10,
            color: 'smoke'
        });
    }
}

function updatePlayerDino() {
    if (!playerDino || playerDino.remove) return;

    if (playerShootCooldown > 0) playerShootCooldown--;

    // Movement
    if (keys['ArrowLeft'] || keys['KeyA']) {
        playerDino.x -= playerDino.speed;
        playerDino.dir = -1;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        playerDino.x += playerDino.speed;
        playerDino.dir = 1;
    }

    // Clamp to screen
    playerDino.x = Math.max(30, Math.min(canvas.width - 30, playerDino.x));

    // Jump
    if ((keys['ArrowUp'] || keys['KeyW']) && !playerDino.jumping) {
        playerDino.jumping = true;
        playerDino.vy = -8;
    }

    // Gravity
    if (playerDino.jumping) {
        playerDino.vy += 0.35;
        playerDino.y += playerDino.vy;
        if (playerDino.y >= playerDino.groundY) {
            playerDino.y = playerDino.groundY;
            playerDino.jumping = false;
            playerDino.vy = 0;
        }
    }

    // Shoot claws + teeth with spacebar
    if (keys['Space'] && playerShootCooldown <= 0) {
        playerShootCooldown = 12;

        // Shoot claw at nearest soldier
        const clawX = playerDino.x + playerDino.dir * 20 * playerDino.size;
        const clawY = playerDino.y + 12 * playerDino.size;
        clawProjectiles.push({
            x: clawX,
            y: clawY,
            vx: playerDino.dir * 5,
            vy: 1,
            life: 80,
            size: playerDino.size,
            remove: false
        });
        addParticles(clawX, clawY, '#e74c3c', 3);

        // Also shoot a tooth upward if jets exist
        if (jets.length > 0) {
            const headX = playerDino.x + playerDino.dir * 30 * playerDino.size;
            const headY = playerDino.y - 10 * playerDino.size;
            let targetJet = null;
            let jDist = Infinity;
            jets.forEach(j => {
                if (j.crashing) return;
                const dist = Math.abs(playerDino.x - j.x);
                if (dist < jDist) { jDist = dist; targetJet = j; }
            });
            if (targetJet) {
                const timeToHit = jDist / 9;
                const leadX = targetJet.x + targetJet.dir * targetJet.speed * timeToHit * 0.7;
                const ldx = leadX - headX;
                const ldy = targetJet.y - headY;
                const ldist = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
                toothProjectiles.push({
                    x: headX, y: headY,
                    vx: (ldx / ldist) * 8,
                    vy: (ldy / ldist) * 8,
                    life: 90, spin: 0, remove: false
                });
            }
        }

        playerDino.jawOpen = 0.8;
    }

    // Jaw close
    playerDino.jawOpen = Math.max(0, playerDino.jawOpen - 0.05);

    // Animate
    playerDino.animTimer++;
    if (playerDino.animTimer > 10) {
        playerDino.animFrame = (playerDino.animFrame + 1) % 4;
        playerDino.animTimer = 0;
    }

    // Stomp soldiers on contact
    soldiers.forEach(s => {
        const dist = Math.abs(playerDino.x - s.x);
        if (dist < 20 * playerDino.size) {
            s.hp = 0;
            s.remove = true;
            addParticles(s.x, s.y - 6, '#c0392b', 8);
        }
    });

    // Attack buildings on contact
    buildings.forEach(b => {
        if (b.destroyed) return;
        const bCenter = b.x + b.w / 2;
        if (Math.abs(playerDino.x - bCenter) < 30 * playerDino.size) {
            if (frameCount % 15 === 0) {
                b.hp--;
                screenShake = 3;
                const intactWindows = b.windows.filter(w => !w.broken);
                if (intactWindows.length > 0) {
                    const win = intactWindows[Math.floor(Math.random() * intactWindows.length)];
                    win.broken = true;
                    win.lit = false;
                }
                addParticles(bCenter, b.y + b.h * 0.3, b.color, 5);
                if (b.hp <= 0) {
                    b.crumbling = true;
                    b.crumbleTimer = 0;
                }
            }
        }
    });

    // Player dino death
    if (playerDino.hp <= 0) {
        playerDino.remove = true;
        addParticles(playerDino.x, playerDino.y, playerDino.color, 30);
        addParticles(playerDino.x, playerDino.y - 20, '#e94560', 20);
        for (let i = 0; i < 5; i++) {
            addSmoke(playerDino.x + (Math.random() - 0.5) * 40, playerDino.y - Math.random() * 30);
        }
        screenShake = 10;
        playerDino = null;
    }
}

function updateDinos() {
    dinos.forEach(d => {
        if (d.isPlayer) return; // player dino handled separately

        d.animTimer++;
        if (d.animTimer > 10) {
            d.animFrame = (d.animFrame + 1) % 4;
            d.animTimer = 0;
        }
        if (d.clawCooldown > 0) d.clawCooldown--;
        if (d.toothCooldown > 0) d.toothCooldown--;

        // Shoot teeth at jets flying overhead
        if (d.toothCooldown <= 0 && jets.length > 0) {
            let nearestJet = null;
            let jDist = 350;
            jets.forEach(j => {
                if (j.crashing) return;
                const dist = Math.abs(d.x - j.x);
                if (dist < jDist) {
                    jDist = dist;
                    nearestJet = j;
                }
            });
            if (nearestJet) {
                d.toothCooldown = 20 + Math.floor(Math.random() * 15);
                d.jawOpen = 1; // open mouth wide to spit tooth
                // Shoot from mouth toward the jet — lead heavily
                const headX = d.x + d.dir * 30 * d.size;
                const headY = d.y - 10 * d.size;
                const timeToHit = jDist / 8; // estimate frames to reach
                const leadX = nearestJet.x + nearestJet.dir * nearestJet.speed * timeToHit * 0.7;
                const leadY = nearestJet.y;
                const ldx = leadX - headX;
                const ldy = leadY - headY;
                const ldist = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
                const toothSpeed = 7 + Math.random() * 2;
                toothProjectiles.push({
                    x: headX,
                    y: headY,
                    vx: (ldx / ldist) * toothSpeed,
                    vy: (ldy / ldist) * toothSpeed,
                    life: 90,
                    spin: 0,
                    remove: false
                });
                addParticles(headX, headY, '#fff', 2);
            }
        }

        // Shoot claws at nearby soldiers (works in any state)
        if (d.clawCooldown <= 0 && soldiers.length > 0) {
            // Find nearest soldier
            let nearestSoldier = null;
            let sDist = 250;
            soldiers.forEach(s => {
                const dist = Math.abs(d.x - s.x);
                if (dist < sDist) {
                    sDist = dist;
                    nearestSoldier = s;
                }
            });
            if (nearestSoldier) {
                d.clawCooldown = 60 + Math.floor(Math.random() * 40);
                d.soldierTarget = nearestSoldier;
                // Shoot claw projectile from the dino's small arms
                const clawDir = nearestSoldier.x > d.x ? 1 : -1;
                const startX = d.x + clawDir * 20 * d.size;
                const startY = d.y + 12 * d.size;
                const dx = nearestSoldier.x - startX;
                const dy = nearestSoldier.y - 6 - startY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                clawProjectiles.push({
                    x: startX,
                    y: startY,
                    vx: (dx / dist) * 4,
                    vy: (dy / dist) * 4,
                    life: 80,
                    size: d.size,
                    remove: false
                });
                // Claw launch particles
                addParticles(startX, startY, '#e74c3c', 3);
            }
        }

        switch (d.state) {
            case 'walking':
                d.x += d.speed * d.dir;
                d.jawOpen = Math.max(0, d.jawOpen - 0.05);

                // Find target building
                if (!d.target) {
                    const standing = buildings.filter(b => !b.destroyed);
                    if (standing.length === 0) {
                        // All destroyed, walk off screen
                        if (d.x < -100 || d.x > canvas.width + 100) {
                            d.remove = true;
                        }
                        break;
                    }
                    // Find nearest building in walking direction
                    let nearest = null;
                    let minDist = Infinity;
                    standing.forEach(b => {
                        const bCenter = b.x + b.w / 2;
                        const dist = Math.abs(d.x - bCenter);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = b;
                        }
                    });
                    d.target = nearest;
                }

                if (d.target && !d.target.destroyed) {
                    const bCenter = d.target.x + d.target.w / 2;
                    d.dir = bCenter > d.x ? 1 : -1;
                    if (Math.abs(d.x - bCenter) < 40 * d.size) {
                        // Random chance to roar first
                        if (Math.random() > 0.7) {
                            d.state = 'roaring';
                            d.roarTimer = 60;
                        } else {
                            d.state = 'attacking';
                        }
                        d.attackTimer = 0;
                    }
                }

                // Occasionally roar while walking
                if (Math.random() < 0.003) {
                    d.state = 'roaring';
                    d.roarTimer = 40;
                }
                break;

            case 'roaring':
                d.jawOpen = Math.min(1, d.jawOpen + 0.1);
                d.roarTimer--;
                screenShake = Math.max(screenShake, 2);
                if (d.roarTimer <= 0) {
                    d.state = d.target && !d.target.destroyed ? 'attacking' : 'walking';
                    d.attackTimer = 0;
                }
                break;

            case 'attacking':
                d.attackTimer++;
                d.jawOpen = 0.3 + Math.sin(d.attackTimer * 0.2) * 0.5;

                if (d.attackTimer % 20 === 0 && d.target && !d.target.destroyed) {
                    d.target.hp--;
                    screenShake = 4;

                    // Break windows
                    const intactWindows = d.target.windows.filter(w => !w.broken);
                    if (intactWindows.length > 0) {
                        const win = intactWindows[Math.floor(Math.random() * intactWindows.length)];
                        win.broken = true;
                        win.lit = false;
                    }

                    addParticles(
                        d.target.x + d.target.w / 2,
                        d.target.y + d.target.h * 0.3,
                        d.target.color,
                        8
                    );
                    addSmoke(d.target.x + d.target.w / 2, d.target.y);

                    if (d.target.hp <= 0) {
                        d.target.crumbling = true;
                        d.target.crumbleTimer = 0;
                    }
                }

                if (d.target && d.target.destroyed) {
                    d.target = null;
                    d.state = 'walking';
                    d.jawOpen = 0;
                    // Briefly roar in triumph
                    d.state = 'roaring';
                    d.roarTimer = 30;
                }

                // Occasionally switch targets
                if (d.attackTimer > 100 && Math.random() < 0.01) {
                    d.target = null;
                    d.state = 'walking';
                }
                break;
        }
    });

    dinos = dinos.filter(d => !d.remove);
}

function updateClawProjectiles() {
    clawProjectiles.forEach(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.life--;
        if (c.life <= 0) { c.remove = true; return; }

        // Check hit on soldiers
        soldiers.forEach(s => {
            const dx = c.x - s.x;
            const dy = c.y - (s.y - 8);
            if (Math.abs(dx) < 10 && Math.abs(dy) < 12) {
                c.remove = true;
                s.hp--;
                addParticles(c.x, c.y, '#e74c3c', 5);
                if (s.hp <= 0) {
                    s.remove = true;
                    addParticles(s.x, s.y - 6, '#c0392b', 10);
                }
            }
        });
    });
    clawProjectiles = clawProjectiles.filter(c => !c.remove);
}

function updateToothProjectiles() {
    toothProjectiles.forEach(t => {
        t.x += t.vx;
        t.y += t.vy;
        t.vy += 0.03; // slight gravity
        t.spin += 0.2;
        t.life--;
        if (t.life <= 0) { t.remove = true; return; }

        // Check hit on jets
        jets.forEach(j => {
            if (j.crashing) return;
            const dx = t.x - j.x;
            const dy = t.y - j.y;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 18) {
                t.remove = true;
                // Don't remove — start crashing
                j.crashing = true;
                j.crashVy = 0.5;
                j.speed *= 0.5; // slow down
                screenShake = 4;
                // Initial hit sparks
                addParticles(j.x, j.y, '#f39c12', 10);
                addParticles(j.x, j.y, '#636e72', 5);
            }
        });

        // Off screen
        if (t.y < -20 || t.x < -20 || t.x > canvas.width + 20) {
            t.remove = true;
        }
    });
    toothProjectiles = toothProjectiles.filter(t => !t.remove);
}

function updateJets() {
    jets.forEach(j => {
        if (j.crashing) {
            // Spiral down slowly
            j.x += j.speed * j.dir;
            j.crashVy += 0.08; // accelerate downward
            j.y += j.crashVy;
            j.crashAngle += j.dir * 0.03; // slow rotation
            j.speed *= 0.995; // gradually slow

            // Trailing smoke and fire
            j.smokeTimer++;
            if (j.smokeTimer % 3 === 0) {
                addSmoke(j.x + (Math.random() - 0.5) * 10, j.y);
            }
            if (j.smokeTimer % 5 === 0) {
                addParticles(j.x - j.dir * 10, j.y, '#f39c12', 2);
            }

            // Hit the ground — big explosion
            if (j.y >= canvas.height - 80) {
                j.remove = true;
                screenShake = 10;
                addParticles(j.x, canvas.height - 85, '#636e72', 25);
                addParticles(j.x, canvas.height - 85, '#f39c12', 20);
                addParticles(j.x, canvas.height - 85, '#e74c3c', 15);
                for (let i = 0; i < 6; i++) {
                    addSmoke(j.x + (Math.random() - 0.5) * 60, canvas.height - 80 - Math.random() * 30);
                }
                // Damage nearby soldiers in the crash
                soldiers.forEach(s => {
                    if (Math.abs(s.x - j.x) < 50) {
                        s.hp = 0;
                        s.remove = true;
                        addParticles(s.x, s.y - 6, '#e74c3c', 6);
                    }
                });
            }
            return;
        }

        j.x += j.speed * j.dir;
        j.afterburner = Math.sin(frameCount * 0.5) * 0.5 + 0.5;
        if (j.missileCooldown > 0) j.missileCooldown--;

        // Fire missiles at dinos as the jet flies over them
        if (j.missilesLeft > 0 && j.missileCooldown <= 0 && dinos.length > 0) {
            // Find a dino roughly below the jet
            dinos.forEach(d => {
                if (j.missilesLeft <= 0) return;
                const dx = Math.abs(j.x - d.x);
                if (dx < 60) {
                    j.missilesLeft--;
                    j.missileCooldown = 30;
                    j.hasFired = true;
                    missiles.push({
                        x: j.x,
                        y: j.y + 10,
                        targetX: d.x,
                        targetY: d.y,
                        target: d,
                        vx: j.dir * 1,
                        vy: 2,
                        life: 120,
                        trail: [],
                        remove: false
                    });
                    // Launch particles
                    addParticles(j.x, j.y + 10, '#f39c12', 4);
                }
            });
        }

        // Remove jet when it flies off screen
        if ((j.dir > 0 && j.x > canvas.width + 100) || (j.dir < 0 && j.x < -100)) {
            j.remove = true;
        }
    });
    jets = jets.filter(j => !j.remove);
}

function updateMissiles() {
    missiles.forEach(m => {
        // Guide toward target
        if (m.target && !m.target.remove) {
            const dx = m.target.x - m.x;
            const dy = m.target.y - m.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            m.vx += (dx / dist) * 0.3;
            m.vy += (dy / dist) * 0.3;
            // Cap speed
            const spd = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
            if (spd > 5) {
                m.vx = (m.vx / spd) * 5;
                m.vy = (m.vy / spd) * 5;
            }
        } else {
            m.vy += 0.1; // gravity if no target
        }

        m.x += m.vx;
        m.y += m.vy;
        m.life--;

        // Smoke trail
        m.trail.push({ x: m.x, y: m.y, life: 20 });
        m.trail = m.trail.filter(t => { t.life--; return t.life > 0; });

        if (m.life <= 0) { m.remove = true; return; }

        // Check hit on dinos
        dinos.forEach(d => {
            const dx = m.x - d.x;
            const dy = m.y - (d.y + 10);
            if (Math.abs(dx) < 25 * d.size && Math.abs(dy) < 30 * d.size) {
                m.remove = true;
                // Missiles do big damage
                d.hp -= 8;
                screenShake = 8;
                // Big explosion
                addParticles(m.x, m.y, '#f39c12', 20);
                addParticles(m.x, m.y, '#e74c3c', 15);
                addParticles(m.x, m.y, '#fff', 5);
                for (let i = 0; i < 3; i++) {
                    addSmoke(m.x + (Math.random() - 0.5) * 30, m.y - Math.random() * 20);
                }
                if (d.hp <= 0) {
                    d.remove = true;
                    dinosKilled++;
                    screenShake = 10;
                    addParticles(d.x, d.y, d.color, 30);
                    addParticles(d.x, d.y - 20, '#e94560', 20);
                    for (let i = 0; i < 6; i++) {
                        addSmoke(d.x + (Math.random() - 0.5) * 50, d.y - Math.random() * 40);
                    }
                }
            }
        });

        // Hit ground = explode
        if (m.y > canvas.height - 80) {
            m.remove = true;
            addParticles(m.x, canvas.height - 80, '#f39c12', 10);
            addSmoke(m.x, canvas.height - 85);
            screenShake = 3;
        }
    });
    missiles = missiles.filter(m => !m.remove);
}

function updateBuildings() {
    buildings.forEach(b => {
        if (b.crumbling && !b.destroyed) {
            b.crumbleTimer++;
            if (b.crumbleTimer > 30) {
                b.destroyed = true;
                totalDestruction++;

                // Create rubble
                const pieces = [];
                for (let i = 0; i < 15; i++) {
                    pieces.push({
                        x: Math.random() * b.w - b.w * 0.3,
                        y: -Math.random() * 15,
                        w: 4 + Math.random() * 10,
                        h: 3 + Math.random() * 6
                    });
                }
                rubblePiles.push({
                    x: b.x + b.w / 2,
                    y: canvas.height - 80 - 10,
                    color: b.color,
                    pieces
                });

                // Big explosion of particles
                addParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 30);
                for (let i = 0; i < 5; i++) {
                    addSmoke(b.x + Math.random() * b.w, b.y + Math.random() * b.h * 0.5);
                }
                screenShake = 8;
            }
        }
    });
}

function updateParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.color === 'smoke') {
            p.vy -= 0.01;
            p.size += 0.1;
        } else {
            p.vy += 0.15;
        }
        p.life--;
    });
    particles = particles.filter(p => p.life > 0);
}

function updateSoldiers() {
    soldiers.forEach(s => {
        s.animTimer++;
        if (s.animTimer > 12) {
            s.animFrame = (s.animFrame + 1) % 4;
            s.animTimer = 0;
        }
        if (s.shootCooldown > 0) s.shootCooldown--;

        switch (s.state) {
            case 'patrolling':
                s.x += s.speed * s.dir;
                // Turn around at edges
                if (s.x < 20 || s.x > canvas.width - 20) s.dir *= -1;

                // Look for nearby dinos
                let nearest = null;
                let minDist = 200;
                dinos.forEach(d => {
                    const dist = Math.abs(s.x - d.x);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = d;
                    }
                });
                if (nearest) {
                    s.target = nearest;
                    s.state = 'shooting';
                    s.dir = nearest.x > s.x ? 1 : -1;
                }
                break;

            case 'shooting':
                // Check if target still alive and in range
                if (!s.target || s.target.hp <= 0 || !dinos.includes(s.target)) {
                    s.target = null;
                    s.state = 'patrolling';
                    break;
                }
                const dist = Math.abs(s.x - s.target.x);
                if (dist > 250) {
                    s.target = null;
                    s.state = 'patrolling';
                    break;
                }
                s.dir = s.target.x > s.x ? 1 : -1;

                // Fire!
                if (s.shootCooldown <= 0) {
                    s.shootCooldown = 35;
                    const gunX = s.x + s.dir * 8;
                    const gunY = s.y - 10;
                    bullets.push({
                        x: gunX,
                        y: gunY,
                        vx: s.dir * 5,
                        vy: -0.3,
                        life: 60,
                        remove: false
                    });
                    // Muzzle flash
                    addParticles(gunX, gunY, '#ffeb3b', 3);
                }
                break;
        }

        // Check collision with dinos — dinos stomp soldiers
        dinos.forEach(d => {
            const dist = Math.abs(s.x - d.x);
            if (dist < 20 * d.size && (d.state === 'walking' || d.state === 'attacking')) {
                s.hp--;
                if (s.hp <= 0) {
                    s.remove = true;
                    addParticles(s.x, s.y - 6, '#c0392b', 8);
                }
            }
        });
    });
    soldiers = soldiers.filter(s => !s.remove);
}

function updateBullets() {
    bullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0) { b.remove = true; return; }

        // Check hit on dinos
        dinos.forEach(d => {
            const dx = b.x - d.x;
            const dy = b.y - (d.y + 10);
            if (Math.abs(dx) < 25 * d.size && Math.abs(dy) < 30 * d.size) {
                b.remove = true;
                d.hp -= 2;
                addParticles(b.x, b.y, '#ffeb3b', 4);
                if (d.hp <= 0) {
                    d.remove = true;
                    dinosKilled++;
                    screenShake = 6;
                    addParticles(d.x, d.y, d.color, 25);
                    addParticles(d.x, d.y - 20, '#e94560', 15);
                    for (let i = 0; i < 4; i++) {
                        addSmoke(d.x + (Math.random() - 0.5) * 40, d.y - Math.random() * 30);
                    }
                }
            }
        });
    });
    bullets = bullets.filter(b => !b.remove);
}

function drawParticles() {
    particles.forEach(p => {
        const alpha = Math.min(1, p.life / 20);
        if (p.color === 'smoke') {
            ctx.fillStyle = `rgba(100,100,100,${alpha * 0.3})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1;
        }
    });
}

function drawSoldier(s) {
    ctx.save();
    ctx.translate(s.x, s.y);

    const legAnim = s.state === 'patrolling' ? Math.sin(frameCount * 0.2) * 3 : 0;

    // Legs
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(-3, -4 + legAnim, 3, 5);
    ctx.fillRect(1, -4 - legAnim, 3, 5);

    // Boots
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-4, 0 + legAnim, 4, 2);
    ctx.fillRect(1, 0 - legAnim, 4, 2);

    // Body
    ctx.fillStyle = '#556b2f';
    ctx.fillRect(-4, -12, 8, 9);

    // Belt
    ctx.fillStyle = '#8b7355';
    ctx.fillRect(-4, -5, 8, 2);

    // Head
    ctx.fillStyle = '#deb887';
    ctx.fillRect(-3, -17, 6, 5);

    // Helmet
    ctx.fillStyle = '#556b2f';
    ctx.fillRect(-4, -19, 8, 4);
    ctx.fillRect(-5, -16, 10, 1);

    // Eyes
    ctx.fillStyle = '#000';
    if (s.dir > 0) {
        ctx.fillRect(1, -15, 1, 1);
    } else {
        ctx.fillRect(-2, -15, 1, 1);
    }

    // Gun
    ctx.fillStyle = '#4a4a4a';
    const gunDir = s.dir;
    ctx.fillRect(gunDir * 3, -11, gunDir * 10, 2);
    ctx.fillRect(gunDir * 11, -13, 2, 4);

    // Muzzle flash when shooting
    if (s.state === 'shooting' && s.shootCooldown > 30) {
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(gunDir * 13, -13, gunDir * 4, 4);
    }

    ctx.restore();
}

function drawBullet(b) {
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(b.x - 3, b.y - 1, 6, 2);
    // Trail
    ctx.fillStyle = 'rgba(255,235,59,0.3)';
    ctx.fillRect(b.x - b.vx * 2, b.y, 4, 1);
}

function drawClawProjectile(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    const angle = Math.atan2(c.vy, c.vx);
    ctx.rotate(angle);
    const s = c.size;

    // Spinning claw shape
    const spin = frameCount * 0.3;
    ctx.rotate(spin);

    ctx.fillStyle = '#e74c3c';
    // Three curved claw blades
    for (let i = 0; i < 3; i++) {
        ctx.rotate(Math.PI * 2 / 3);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(3 * s, -6 * s);
        ctx.lineTo(1 * s, -3 * s);
        ctx.fill();
    }

    // Center
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.arc(0, 0, 2 * s, 0, Math.PI * 2);
    ctx.fill();

    // Glow trail
    ctx.restore();
    ctx.fillStyle = `rgba(231,76,60,0.3)`;
    ctx.beginPath();
    ctx.arc(c.x - c.vx, c.y - c.vy, 4 * c.size, 0, Math.PI * 2);
    ctx.fill();
}

function drawToothProjectile(t) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.spin);

    // Tooth shape - white triangle with a root
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(-3, 3);
    ctx.lineTo(3, 3);
    ctx.closePath();
    ctx.fill();

    // Root
    ctx.fillStyle = '#f5e6ca';
    ctx.fillRect(-1.5, 3, 3, 3);

    ctx.restore();

    // Small trail
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(t.x - t.vx, t.y - t.vy, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawJet(j) {
    ctx.save();
    ctx.translate(j.x, j.y);
    if (j.crashing) {
        ctx.rotate(j.crashAngle);
    }
    ctx.scale(j.dir, 1);

    // Afterburner flame (flickers when crashing)
    const flameLen = j.crashing
        ? 4 + Math.random() * 6
        : 10 + j.afterburner * 8;
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.moveTo(-18, -1);
    ctx.lineTo(-18 - flameLen, 0);
    ctx.lineTo(-18, 2);
    ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    ctx.lineTo(-18 - flameLen * 0.6, 0.5);
    ctx.lineTo(-18, 1);
    ctx.fill();

    // Main body
    ctx.fillStyle = '#636e72';
    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.lineTo(15, -4);
    ctx.lineTo(-18, -3);
    ctx.lineTo(-18, 4);
    ctx.lineTo(15, 4);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#74b9ff';
    ctx.beginPath();
    ctx.ellipse(14, -1, 5, 3, -0.1, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.fillStyle = '#4a5568';
    // Top wing
    ctx.beginPath();
    ctx.moveTo(2, -3);
    ctx.lineTo(-5, -14);
    ctx.lineTo(-10, -14);
    ctx.lineTo(-8, -3);
    ctx.fill();
    // Bottom wing
    ctx.beginPath();
    ctx.moveTo(2, 4);
    ctx.lineTo(-5, 14);
    ctx.lineTo(-10, 14);
    ctx.lineTo(-8, 4);
    ctx.fill();

    // Tail fin
    ctx.fillStyle = '#4a5568';
    ctx.beginPath();
    ctx.moveTo(-15, -3);
    ctx.lineTo(-20, -10);
    ctx.lineTo(-22, -10);
    ctx.lineTo(-18, -3);
    ctx.fill();

    // Missile hardpoints (show remaining missiles)
    if (j.missilesLeft >= 1) {
        ctx.fillStyle = '#dfe6e9';
        ctx.fillRect(-4, 6, 8, 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(3, 5, 3, 3);
    }
    if (j.missilesLeft >= 2) {
        ctx.fillStyle = '#dfe6e9';
        ctx.fillRect(-4, -8, 8, 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(3, -9, 3, 3);
    }

    // Damage effects when crashing
    if (j.crashing) {
        // Fire on the fuselage
        ctx.fillStyle = `rgba(243,156,18,${0.5 + Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(-5 + Math.random() * 10, Math.random() * 4 - 2, 4 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
        // Black smoke damage marks
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-12, -2, 6, 3);
        ctx.fillRect(2, 1, 5, 2);
    }

    ctx.restore();
}

function drawMissile(m) {
    // Draw smoke trail
    m.trail.forEach(t => {
        const alpha = t.life / 20;
        ctx.fillStyle = `rgba(200,200,200,${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 2 + (1 - alpha) * 3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw missile body
    ctx.save();
    ctx.translate(m.x, m.y);
    const angle = Math.atan2(m.vy, m.vx);
    ctx.rotate(angle);

    // Body
    ctx.fillStyle = '#dfe6e9';
    ctx.fillRect(-6, -2, 12, 4);

    // Nose cone
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(10, 0);
    ctx.lineTo(6, 2);
    ctx.fill();

    // Fins
    ctx.fillStyle = '#636e72';
    ctx.beginPath();
    ctx.moveTo(-6, -2);
    ctx.lineTo(-8, -5);
    ctx.lineTo(-4, -2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, 2);
    ctx.lineTo(-8, 5);
    ctx.lineTo(-4, 2);
    ctx.fill();

    // Exhaust flame
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.moveTo(-6, -1);
    ctx.lineTo(-10 - Math.random() * 4, 0);
    ctx.lineTo(-6, 1);
    ctx.fill();

    ctx.restore();
}

function drawDinoHpBar(d) {
    if (d.hp >= d.maxHp) return;
    const barW = 30 * d.size;
    const barH = 3;
    const barX = d.x - barW / 2;
    const barY = d.y - 30 * d.size;
    const pct = d.hp / d.maxHp;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = pct > 0.5 ? '#2ecc71' : pct > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(barX, barY, barW * pct, barH);
}

function drawDestructionMeter() {
    const total = buildings.length;
    const destroyed = totalDestruction;
    const pct = destroyed / total;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 200, 20);
    ctx.fillStyle = '#e94560';
    ctx.fillRect(10, 10, 200 * pct, 20);
    ctx.strokeStyle = '#e94560';
    ctx.strokeRect(10, 10, 200, 20);

    ctx.fillStyle = '#fff';
    ctx.font = '12px Courier New';
    ctx.fillText(`DESTRUCTION: ${Math.floor(pct * 100)}%`, 15, 25);

    ctx.fillText(`SOLDIERS: ${soldiers.length}`, canvas.width - 150, 25);
    ctx.fillText(`JETS: ${jets.length}`, canvas.width - 150, 45);
    ctx.fillText(`DINOS: ${dinos.length}`, canvas.width - 150, 65);
    ctx.fillText(`KILLS: ${dinosKilled}`, canvas.width - 150, 85);

    // Player HP bar
    if (playerDino && !playerDino.remove) {
        ctx.fillStyle = '#fff';
        ctx.fillText('YOUR HP:', 10, 50);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(80, 40, 100, 12);
        const hpPct = playerDino.hp / playerDino.maxHp;
        ctx.fillStyle = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#e74c3c';
        ctx.fillRect(80, 40, 100 * hpPct, 12);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(80, 40, 100, 12);
    } else if (!playerDino) {
        ctx.fillStyle = '#e74c3c';
        ctx.fillText('YOU DIED', 10, 50);
    }

    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '10px Courier New';
    ctx.fillText('ARROWS: Move/Jump  SPACE: Shoot', 10, canvas.height - 10);
}

function update() {
    frameCount++;

    updatePlayerDino();
    updateDinos();
    updateBuildings();
    updateSoldiers();
    updateBullets();
    updateClawProjectiles();
    updateToothProjectiles();
    updateJets();
    updateMissiles();
    updateParticles();

    // Spawn more dinos over time
    if (frameCount % 600 === 0 && dinos.length < 5) {
        spawnDino();
    }

    // Spawn more soldiers over time
    if (frameCount % 400 === 0 && soldiers.length < 8) {
        spawnSoldier();
    }

    // Jets fly by periodically
    if (frameCount % 500 === 0 && dinos.length > 0 && jets.length < 2) {
        spawnJet();
    }

    // Update message
    messageTimer++;
    if (messageTimer > 300) {
        messageTimer = 0;
        currentMessage = (currentMessage + 1) % messages.length;
        messageEl.textContent = messages[currentMessage];
    }

    // Screen shake decay
    screenShake *= 0.9;
    if (screenShake < 0.1) screenShake = 0;

    // Check if city is fully destroyed
    if (totalDestruction === buildings.length && buildings.length > 0) {
        messageEl.textContent = "The city is destroyed. The soldiers tried. Click to rebuild and try again.";
    }
}

function draw() {
    ctx.save();
    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
    }

    drawSky();
    drawStars();
    drawClouds();

    // Draw jets in the sky
    jets.forEach(j => drawJet(j));

    // Draw missiles
    missiles.forEach(m => drawMissile(m));

    // Draw tooth projectiles
    toothProjectiles.forEach(t => drawToothProjectile(t));

    // Draw buildings back to front
    buildings.forEach(b => drawBuilding(b));
    rubblePiles.forEach(r => drawRubble(r));

    drawGround();

    // Draw soldiers
    soldiers.forEach(s => drawSoldier(s));

    // Draw bullets
    bullets.forEach(b => drawBullet(b));

    // Draw claw projectiles
    clawProjectiles.forEach(c => drawClawProjectile(c));

    // Draw dinos
    dinos.forEach(d => {
        drawDino(d);
        drawDinoHpBar(d);
    });

    // Draw player indicator
    if (playerDino && !playerDino.remove) {
        const px = playerDino.x;
        const py = playerDino.y - 40 * playerDino.size;
        const bob = Math.sin(frameCount * 0.08) * 3;
        // Arrow pointing down
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.moveTo(px, py + bob + 8);
        ctx.lineTo(px - 6, py + bob);
        ctx.lineTo(px + 6, py + bob);
        ctx.closePath();
        ctx.fill();
        // "YOU" label
        ctx.fillStyle = '#ffeb3b';
        ctx.font = 'bold 10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('YOU', px, py + bob - 2);
        ctx.textAlign = 'start';
    }

    drawParticles();
    drawDestructionMeter();

    // Fires on damaged buildings
    buildings.forEach(b => {
        if (!b.destroyed && b.hp < b.maxHp * 0.5) {
            if (frameCount % 5 === 0) {
                addSmoke(b.x + Math.random() * b.w, b.y + 10);
            }
            // Fire glow
            ctx.fillStyle = `rgba(233,69,96,${0.1 + Math.sin(frameCount * 0.1) * 0.05})`;
            ctx.fillRect(b.x, b.y, b.w, b.h);
        }
    });

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', () => {
    if (totalDestruction === buildings.length && buildings.length > 0) {
        init();
    }
});

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

init();
gameLoop();
    </script>
</body>
</html>
